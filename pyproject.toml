[project]
name = "blackfactory"
version = "0.1.0"
description = "游戏黑灯工厂：一句话题材 → PRD → 代码+素材 → 自动检验 → 人工终审"
requires-python = ">=3.12"
dependencies = [
  "openai>=2.0",
  "playwright>=1.55",
  "pillow>=11",
  "jsonschema>=4",
  "yt-dlp>=2025.1",
]

[tool.setuptools]
packages = []   # 纯脚本仓库：pyproject 只用来声明依赖，pip install -e . 即装依赖
